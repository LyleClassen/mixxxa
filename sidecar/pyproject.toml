[project]
name = "orbit-sidecar"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "orbit-dsp==1.0.1",
    # drop-detector inference (dropdetect/ + drops.py)
    "pandas>=2.0",
    "xgboost>=2.0",
    "joblib>=1.3",
    "scikit-learn>=1.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
